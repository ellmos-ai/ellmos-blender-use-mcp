<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">ellmos-blender-use-mcp 4-View Visual Verification &amp; Telemetry Pipeline</title>
  <desc id="desc">Four orthogonal and perspective Cycles/EEVEE inspection renders (Front, Side, Top, Perspective) paired with structured transform, pivot, and bounded stdout JSON telemetry.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#131922" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea7600" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="960" height="440" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="20" y="18" width="920" height="404" rx="10" fill="url(#grid)" opacity="0.45" />

  <!-- Header -->
  <rect x="32" y="28" width="896" height="46" rx="8" fill="#161b22" stroke="#30363d" />
  <circle cx="56" cy="51" r="7" fill="#ea7600" />
  <text x="74" y="56" fill="#f0f6fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">blender_verify_visual</text>
  <text x="258" y="56" fill="#8b949e" font-family="Consolas, monospace" font-size="13">4-View Orthogonal + Isometric QA Inspection</text>
  <rect x="760" y="39" width="152" height="24" rx="12" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-opacity="0.6" />
  <text x="836" y="55" text-anchor="middle" fill="#79c0ff" font-family="Consolas, monospace" font-size="11" font-weight="700">INV-VISUAL-06</text>

  <!-- Panel 1: Front -->
  <rect x="32" y="90" width="290" height="156" rx="10" fill="#161b22" stroke="#30363d" />
  <text x="48" y="114" fill="#ea7600" font-family="Consolas, monospace" font-size="12" font-weight="700">1. FRONT (-Y)</text>
  <text x="244" y="114" fill="#8b949e" font-family="Consolas, monospace" font-size="11">view_front.png</text>
  <line x1="48" y1="220" x2="306" y2="220" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3" />
  <rect x="132" y="142" width="90" height="78" rx="4" fill="#ea7600" fill-opacity="0.18" stroke="#ea7600" stroke-width="2" />
  <rect x="150" y="128" width="54" height="14" rx="2" fill="#58a6ff" fill-opacity="0.22" stroke="#58a6ff" stroke-width="1.5" />
  <circle cx="177" cy="220" r="4" fill="#3fb950" />
  <text x="48" y="236" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Checks: Ground contact (Z=0) &amp; vertical alignment</text>

  <!-- Panel 2: Side -->
  <rect x="336" y="90" width="290" height="156" rx="10" fill="#161b22" stroke="#30363d" />
  <text x="352" y="114" fill="#58a6ff" font-family="Consolas, monospace" font-size="12" font-weight="700">2. SIDE (+X)</text>
  <text x="548" y="114" fill="#8b949e" font-family="Consolas, monospace" font-size="11">view_side.png</text>
  <line x1="352" y1="220" x2="610" y2="220" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3" />
  <polygon points="436,220 436,150 492,132 526,150 526,220" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="2" />
  <circle cx="481" cy="220" r="4" fill="#3fb950" />
  <text x="352" y="236" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Checks: Depth profile, overhangs &amp; forward axis</text>

  <!-- Panel 3: Top -->
  <rect x="32" y="260" width="290" height="156" rx="10" fill="#161b22" stroke="#30363d" />
  <text x="48" y="284" fill="#3fb950" font-family="Consolas, monospace" font-size="12" font-weight="700">3. TOP (+Z)</text>
  <text x="250" y="284" fill="#8b949e" font-family="Consolas, monospace" font-size="11">view_top.png</text>
  <line x1="177" y1="296" x2="177" y2="392" stroke="#30363d" stroke-width="1" />
  <line x1="72" y1="344" x2="282" y2="344" stroke="#30363d" stroke-width="1" />
  <rect x="129" y="314" width="96" height="60" rx="6" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="2" />
  <circle cx="177" cy="344" r="4" fill="#ea7600" />
  <text x="48" y="404" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Checks: Footprint symmetry &amp; pivot centering</text>

  <!-- Panel 4: Perspective -->
  <rect x="336" y="260" width="290" height="156" rx="10" fill="#161b22" stroke="#30363d" />
  <text x="352" y="284" fill="#d2a8ff" font-family="Consolas, monospace" font-size="12" font-weight="700">4. PERSPECTIVE (ISO)</text>
  <text x="518" y="284" fill="#8b949e" font-family="Consolas, monospace" font-size="11">view_perspective.png</text>
  <!-- Simple isometric cube -->
  <polygon points="481,306 534,332 481,358 428,332" fill="#d2a8ff" fill-opacity="0.22" stroke="#d2a8ff" stroke-width="1.8" />
  <polygon points="428,332 481,358 481,394 428,368" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.8" />
  <polygon points="534,332 481,358 481,394 534,368" fill="#ea7600" fill-opacity="0.20" stroke="#ea7600" stroke-width="1.8" />
  <text x="352" y="404" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Checks: Silhouette, shading &amp; 3D proportions</text>

  <!-- Right Column: JSON Telemetry & Safety Guardrails -->
  <rect x="642" y="90" width="286" height="326" rx="10" fill="#0b0f14" stroke="url(#accentGrad)" stroke-width="1.5" />
  <text x="658" y="116" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">JSON Inspection Telemetry</text>
  <rect x="656" y="130" width="258" height="162" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="668" y="152" fill="#79c0ff" font-family="Consolas, monospace" font-size="11.5">{</text>
  <text x="680" y="172" fill="#e6edf3" font-family="Consolas, monospace" font-size="11.5">"meshCount": 3,</text>
  <text x="680" y="192" fill="#e6edf3" font-family="Consolas, monospace" font-size="11.5">"materialCount": 2,</text>
  <text x="680" y="212" fill="#3fb950" font-family="Consolas, monospace" font-size="11.5">"unappliedRotation": false,</text>
  <text x="680" y="232" fill="#3fb950" font-family="Consolas, monospace" font-size="11.5">"pivotAtOrigin": true,</text>
  <text x="680" y="252" fill="#e6edf3" font-family="Consolas, monospace" font-size="11.5">"dimensions_m": [1.8, 0.9, 2.1],</text>
  <text x="680" y="272" fill="#d2a8ff" font-family="Consolas, monospace" font-size="11.5">"views": 4</text>
  <text x="668" y="286" fill="#79c0ff" font-family="Consolas, monospace" font-size="11.5">}</text>

  <!-- Guardrails -->
  <rect x="656" y="304" width="258" height="98" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="668" y="324" fill="#ea7600" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Runtime Guardrails</text>
  <text x="668" y="344" fill="#8b949e" font-family="Consolas, monospace" font-size="11">• Headless --factory-startup</text>
  <text x="668" y="362" fill="#8b949e" font-family="Consolas, monospace" font-size="11">• 180s Timeout + 8 KB Tail Cap</text>
  <text x="668" y="380" fill="#8b949e" font-family="Consolas, monospace" font-size="11">• Non-interactive EEVEE / Cycles</text>
  <text x="668" y="396" fill="#3fb950" font-family="Consolas, monospace" font-size="11">• Zero Viewport Hijack (INV-02)</text>
</svg>
